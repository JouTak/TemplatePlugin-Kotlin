# Настройки Lifesteal плагина

# Длительность PvE режима в минутах (по умолчанию: 180 минут = 3 часа)
# В течение этого времени игроки не могут атаковать друг друга
pve-duration: 180

# Начальное количество сердец у новых игроков
starting-hearts: 10

# Максимальное количество сердец, которое может иметь игрок
max-hearts: 20

# Длительность бана в минутах при потере всех сердец
ban-duration: 30

# Длительность иммунитета в часах после возвращения с бана
immunity-duration: 24